[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "black>=24.10.0,<25",
  "isort>=5.13.2,<6",
  "mypy>=1.14.0,<2",
  "poethepoet==0.33",
  "pre-commit>=4.0.1,<5",
  "pylint>=3.3.2,<4",
  "pytest-cov>=4.1.0,<5",
  "pytest>=8.3.4,<9",
  "toml-sort>=0.24.2,<0.25",
]

[project]
authors = [{name = "Damien Robert, Hugo Raguet, Loic Landrieu"}]
dependencies = []
description = ""
name = "superpoint_transformer"
readme = "README.md"
requires-python = ">=3.10,<3.11"
version = "0.1.0"

[tool.hatch.build.targets.sdist]
include = [
  "src"
]

[tool.hatch.build.targets.wheel]
include = [
  "src"
]

[tool.tomlsort]
all = true

[tool.uv]
environments = ["sys_platform == 'linux'"]